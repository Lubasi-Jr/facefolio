services:

  backend:
    build: .
    ports:
      - "8000:8000"
    # Load Supabase vars (SUPABASE_URL, SUPABASE_SERVICE_KEY, etc.) from .env.
    # DATABASE_URL and REDIS_URL are overridden below to target the local services
    # instead of the remote Supabase/Upstash URLs stored in .env.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/facefolio
      REDIS_URL: redis://redis:6379
    volumes:
      - insightface_models:/root/.insightface
    depends_on:
      postgres:
        condition: service_healthy   # wait for pg_isready before starting
      redis:
        condition: service_started

  worker:
    build: .
    # --pool=solo: the default prefork pool forks child processes, and native
    # ML libs (onnxruntime, OpenCV) loaded in worker_process_init don't
    # survive fork() cleanly (the worker hangs). solo runs single-process/
    # single-thread with no forking, so the CV libraries initialize once in
    # the main process. --concurrency doesn't apply under solo, so it's
    # dropped here. Production can revisit a fork-safe pool (load the model
    # lazily inside each child instead of at worker_process_init, or use
    # --pool=threads) once concurrent processing is worth the complexity.
    command: /app/.venv/bin/celery -A app.worker.celery_app worker --loglevel=info --pool=solo
    # Load Supabase vars (SUPABASE_URL, SUPABASE_SERVICE_KEY, etc.) from .env.
    # DATABASE_URL and REDIS_URL are overridden below to target the local services
    # instead of the remote Supabase/Upstash URLs stored in .env.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/facefolio
      REDIS_URL: redis://redis:6379
    volumes:
      - insightface_models:/root/.insightface
    depends_on:
      postgres:
        condition: service_healthy   # wait for pg_isready before starting
      redis:
        condition: service_started

  beat:
    build: .
    command: /app/.venv/bin/celery -A app.worker.celery_app beat --loglevel=info
    # Load Supabase vars (SUPABASE_URL, SUPABASE_SERVICE_KEY, etc.) from .env.
    # DATABASE_URL and REDIS_URL are overridden below to target the local services
    # instead of the remote Supabase/Upstash URLs stored in .env.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/facefolio
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"   # expose so you can connect with psql / TablePlus locally
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: facefolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facefolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"   # expose for redis-cli inspection locally

volumes:
  postgres_data:
  insightface_models:
